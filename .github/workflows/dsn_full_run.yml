name: DSN 1k full TranAD+ reproduction

on:
  workflow_dispatch:
  push:
    branches:
      - contrib/open-source-patches-2026-09
    paths:
      - .github/workflows/dsn_full_run.yml
      - contributions/dsn/actions/**

permissions:
  contents: read

jobs:
  dsn-full-run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      TRANAD_COMMIT: 2f02268d1fb606d85e55e76422a5fc00a08dc6d5
      IDENTIFIER: TranAD_DSN_1k_lr0-0001_dff16_wz10_model
    steps:
      - name: Checkout contribution runner
        uses: actions/checkout@v4

      - name: Free runner disk and record resources
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          mkdir -p work/results
          df -h | tee work/results/disk_before.txt
          free -h | tee work/results/memory_before.txt
          nproc | tee work/results/cpu_count.txt

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal TranAD+ runtime
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.0.0"
          python -m pip install \
            "numpy==1.26.0" \
            "pandas==2.1.1" \
            "scikit-learn==1.2.2" \
            "tqdm==4.65.0" \
            "scipy==1.11.4" \
            "matplotlib==3.8.0" \
            "gdown==5.2.0"
          python - <<'PY'
          import torch, numpy, pandas, sklearn, matplotlib
          print('torch', torch.__version__)
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('sklearn', sklearn.__version__)
          print('matplotlib', matplotlib.__version__)
          PY

      - name: Fetch pinned TranAD+ source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/yunks128/TranADPlus.git work/TranADPlus
          git -C work/TranADPlus checkout "$TRANAD_COMMIT"
          test "$(git -C work/TranADPlus rev-parse HEAD)" = "$TRANAD_COMMIT"
          mkdir -p work/TranADPlus/Datasets/Raw/DSN_1k work/TranADPlus/Checkpoints

      - name: Download and verify public DSN 1k files
        shell: bash
        run: |
          set -euxo pipefail
          cd work/TranADPlus/Datasets/Raw/DSN_1k
          curl -L --fail --retry 8 --retry-all-errors --continue-at - \
            https://osf.io/download/kqrtg/ -o drs.pkl
          echo "e0786e080033c01ddc0549748c42ed252ddf08bb4d374148a5bb9b8c8f4683b1  drs.pkl" | sha256sum -c -

          curl -L --fail --retry 8 --retry-all-errors --continue-at - \
            https://osf.io/download/7gxc3/ -o mons.pkl
          echo "c282400d9e810b787d9160999dc4f13438e8dccaaae56cda580a67a9b922d6eb  mons.pkl" | sha256sum -c -
          ls -lh drs.pkl mons.pkl
          df -h

      - name: Download and verify exact public checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          gdown "https://drive.google.com/uc?id=1xvc3S6T8LYPKMc0gMsslhJvoq20kS5jc" \
            -O "work/TranADPlus/Checkpoints/${IDENTIFIER}.ckpt"
          echo "3e7f0e91bc8134afb00384c3a3ebe47834d239e4ffeb3c02e5389f043440c866  work/TranADPlus/Checkpoints/${IDENTIFIER}.ckpt" | sha256sum -c -
          ls -lh "work/TranADPlus/Checkpoints/${IDENTIFIER}.ckpt"

      - name: Initialize, parse, and preprocess DSN 1k
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY' 2>&1 | tee work/results/preprocess.log
          import sys
          from pathlib import Path
          repo = Path('work/TranADPlus').resolve()
          sys.path.insert(0, str(repo.parent))
          from TranADPlus.src import preprocess_data, parse_data

          print('STEP initialize_dataset DSN_1k', flush=True)
          preprocess_data.initialize_dataset('DSN_1k')
          print('STEP parse_tracks DSN_1k', flush=True)
          parse_data.parse_tracks('DSN_1k')
          print('STEP preprocess_data DSN_1k', flush=True)
          preprocess_data.preprocess_data('DSN_1k')
          print('PREPROCESS COMPLETE', flush=True)
          PY
          df -h | tee work/results/disk_after_preprocess.txt
          free -h | tee work/results/memory_after_preprocess.txt

      - name: Remove raw/intermediate copies before inference
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf work/TranADPlus/Datasets/Raw work/TranADPlus/Datasets/Original work/TranADPlus/Datasets/EDA
          df -h | tee work/results/disk_before_inference.txt
          du -sh work/TranADPlus/Datasets/Preprocessed/DSN_1k | tee work/results/preprocessed_size.txt

      - name: Run memory-bounded checkpoint inference
        shell: bash
        run: |
          set -euxo pipefail
          python contributions/dsn/actions/dsn_stream_run.py \
            --repo-root work/TranADPlus \
            --identifier "$IDENTIFIER" \
            --batch-size 2048 \
            --out work/results/dsn_stream_scores.npz \
            2>&1 | tee work/results/inference.log
          free -h | tee work/results/memory_after_inference.txt

      - name: Calibrate threshold on separate tracks and score held-out tracks
        shell: bash
        run: |
          set -euxo pipefail
          python contributions/dsn/actions/calibrate_scores.py \
            --scores work/results/dsn_stream_scores.npz \
            --out work/results/threshold_calibration.json \
            2>&1 | tee work/results/calibration.log
          cat work/results/threshold_calibration.json

      - name: Write reproducibility manifest
        if: always()
        shell: bash
        run: |
          {
            echo "tranad_commit=${TRANAD_COMMIT}"
            echo "checkpoint_identifier=${IDENTIFIER}"
            echo "checkpoint_sha256=3e7f0e91bc8134afb00384c3a3ebe47834d239e4ffeb3c02e5389f043440c866"
            echo "mons_sha256=c282400d9e810b787d9160999dc4f13438e8dccaaae56cda580a67a9b922d6eb"
            echo "drs_sha256=e0786e080033c01ddc0549748c42ed252ddf08bb4d374148a5bb9b8c8f4683b1"
            echo "published_alpha=1.0"
            echo "published_beta=0.0"
            echo "published_pot_threshold=0.0029835498576782607"
            date -u +"finished_or_failed_at=%Y-%m-%dT%H:%M:%SZ"
          } > work/results/reproducibility_manifest.txt

      - name: Upload DSN run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsn-1k-full-run-evidence
          path: work/results/
          if-no-files-found: warn
          retention-days: 30
